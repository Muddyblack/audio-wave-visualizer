<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <!-- Wide sample cover for the artwork format previews: a framed title at the
       top, a caption at the bottom and coloured side edges, so cropping, bands,
       squeezing and the 16:9 box each look different. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fb8"/>
      <stop offset="0.5" stop-color="#1a1d3f"/>
      <stop offset="1" stop-color="#2fd6ff"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#05060f" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#05060f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#7fe8ff" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#7fe8ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7fe8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="180" fill="url(#sky)"/>
  <rect width="320" height="180" fill="url(#shade)"/>
  <circle cx="160" cy="92" r="42" fill="url(#glow)"/>
  <rect x="78" y="14" width="164" height="30" rx="3" fill="none" stroke="#ffffff" stroke-width="4"/>
  <rect x="92" y="25" width="136" height="8" rx="4" fill="#ffffff"/>
  <rect x="58" y="150" width="204" height="7" rx="3.5" fill="#ffffff" opacity="0.9"/>
</svg>

name: Windows

# The overlay's --selftest on both Windows and Linux, and the Windows build:
# the .exe, checked with its own --selftest, zipped and wrapped in the
# installer. release.yml runs this same workflow for a tag and attaches what
# it builds to the release. See docs/windows.md.
#
# --selftest loads the real render tree headless and fails on any QML warning.
# It deliberately opens no audio device: GitHub runners have none, so whether
# capture actually produces bars can only be checked on a real machine.

on:
  pull_request:
  push:
    branches:
      - main
      - master
  # A build from any branch by hand: Actions → Windows → Run workflow.
  workflow_dispatch: {}
  workflow_call:
    inputs:
      version:
        description: The release's version (a leading "v" is dropped); names the files and the installer
        type: string
        required: true

permissions:
  contents: read

jobs:
  # Only meaningful for pull_request/push: a workflow_dispatch run was asked
  # for by hand and a workflow_call run is release.yml cutting a release, so
  # both always build regardless of what changed.
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'windows/**'
              - '.github/workflows/windows.yml'
              # The overlay hosts this shared render tree and its settings
              # parser, so a change there can break the Windows build alone.
              - 'package/contents/**'
              - 'hyprland/Configuration.js'

  test:
    needs: changes
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || inputs.version != '' || needs.changes.outputs.relevant == 'true')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      # The app's range, not the build's pins: the newest PySide6 is tried
      # here before a bump of windows/build-requirements.txt ships it.
      - name: install
        run: python -m pip install -r windows/requirements.txt

      - name: overlay loads
        run: python windows/app.py --selftest

      # --selftest never imports it, so nothing else would catch a break here.
      # Windows only: importing soundcard on Linux needs a running PulseAudio.
      - name: capture module imports
        if: runner.os == 'Windows'
        run: python -c "import sys; sys.path.insert(0, 'windows'); import audio_capture"

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: version
        shell: pwsh
        env:
          # Through the environment rather than spliced into the script.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = "$env:INPUT_VERSION".TrimStart("v")
          if (-not $version) { $version = "0.0.0-ci" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: build
        run: |
          python -m pip install -r windows/build-requirements.txt
          pyinstaller --noconfirm windows/audio-visualizer.spec

      - name: bundled app loads
        shell: pwsh
        # The selftest takes seconds; a hang (a modal error dialog nobody can
        # click) should fail fast rather than sit out the six-hour job limit.
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist/Audio Visualizer/Audio Visualizer.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: zip
        shell: pwsh
        run: Compress-Archive -Path "dist/Audio Visualizer" -DestinationPath "audio-visualizer-windows-$env:VERSION.zip"

      - name: installer
        shell: pwsh
        run: windows/build-installer.ps1 -Version $env:VERSION

      - name: Package manager manifests (stable releases)
        if: inputs.version != '' && !contains(inputs.version, '-')
        shell: pwsh
        run: python windows/package-manifests.py --version $env:VERSION

      - uses: actions/upload-artifact@v7
        with:
          name: audio-visualizer-windows
          path: |
            audio-visualizer-windows-*.zip
            Audio-Visualizer-Setup-*.exe
            dist/package-manifests/audio-visualizer.json
            dist/package-manifests/audio-visualizer-winget-*.zip
          if-no-files-found: error
          # A release has its own copy attached; this one is for trying a build.
          retention-days: 14

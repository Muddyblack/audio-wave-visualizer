name: Deploy Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - docs/**
      - package/icon.png
      - package/contents/config/main.xml
      - package/contents/code/*.js
      - package/contents/ui/studio/*.js
      - package/contents/ui/studio/wallpapers/**
      - tools/sync_studio_assets.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build shared studio assets
        run: |
          python3 tools/sync_studio_assets.py
          python3 tools/sync_studio_assets.py --check

      - uses: actions/setup-node@v7
        with:
          node-version: 'current'
          check-latest: true
          package-manager-cache: false

      - name: Verify website integration
        run: |
          node tests/test_website_contracts.cjs
          node tests/test_preset_exchange.cjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/website

      - id: deployment
        uses: actions/deploy-pages@v5

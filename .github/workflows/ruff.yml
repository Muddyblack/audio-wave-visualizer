name: Ruff

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31.11.1
      - name: Python lint
        run: nix run .#ruff -- check .
      - name: Python formatting
        run: nix run .#ruff -- format --check .

name: Release

on:
  push:
    tags:
      - "v*"

# Read-only unless a job asks for more; only the jobs that publish do.
permissions:
  contents: read

jobs:
  # The .plasmoid release goes out on its own, so a broken Windows build
  # cannot hold it back; the Windows files are attached to it once they pass.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build .plasmoid
        run: make pack

      - name: Get version and artifact path
        id: info
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="$(basename "$PWD")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=${NAME}-${VERSION}.plasmoid" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG="$(git tag --sort=-creatordate | grep -E '^v' | sed -n '2p')"
          if [ -n "$PREV_TAG" ]; then
            NOTES="$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s' --no-merges)"
          else
            NOTES="$(git log --pretty=format:'- %s' --no-merges)"
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.info.outputs.version }}
          body: |
            ## Changes
            ${{ steps.notes.outputs.notes }}

            ---
            Install by downloading the `.plasmoid` file and running:
            ```
            plasmapkg2 -i ${{ steps.info.outputs.artifact }}
            ```

            **Windows (not yet tested on a real Windows machine — see [docs/windows.md](https://github.com/Muddyblack/audio-wave-visualizer/blob/main/docs/windows.md)):** run `Audio-Visualizer-Setup-${{ steps.info.outputs.version }}.exe` (no admin rights needed; it updates an existing install in place), or unzip `audio-visualizer-windows-${{ steps.info.outputs.version }}.zip` anywhere and run `Audio Visualizer.exe`.

            Stable Windows builds also include Scoop and WinGet manifests. See the [package manager instructions](https://github.com/Muddyblack/audio-wave-visualizer/blob/main/docs/windows.md#2-package-managers-scoop-winget).

            The Windows asset is attached a few minutes after the release appears, once its build has passed.
          files: ${{ steps.info.outputs.artifact }}

  # The workflow every push runs — the overlay's own selftest, the build,
  # the built .exe's selftest, the installer — with the release's version in
  # the file names.
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ github.ref_name }}

  windows-assets:
    needs: [release, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: audio-visualizer-windows

      - name: Attach the Windows build to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            audio-visualizer-windows-*.zip
            Audio-Visualizer-Setup-*.exe
            dist/package-manifests/audio-visualizer.json
            dist/package-manifests/audio-visualizer-winget-*.zip

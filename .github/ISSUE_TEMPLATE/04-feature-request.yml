name: Feature / preset idea
description: Suggest a preset, layout, studio improvement, lyrics feature, or other enhancement.
title: "[Feature]: "
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Presets / layouts / artwork
        - Settings studio / preset sharing
        - Lyrics / karaoke
        - Media information / playback controls
        - Audio capture / sources
        - Installation / desktop integration
        - Other
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to do?
      description: Describe the idea and how it would help. For a preset, describe the overall look and where you would use it.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: How should it work?
      description: Describe the desired behavior or settings. Mention Plasma, Hyprland/Quickshell, or the browser studio if relevant.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples and alternatives
      description: Share screenshots, sketches, related ideas, or an exported preset JSON. If you have a workaround, describe it here.
